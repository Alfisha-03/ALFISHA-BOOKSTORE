
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Book | ALFISHA BOOKSTORE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="nav-container">

            <div class="brand">
                <div class="brand-mark">A</div>

                <div class="brand-text">
                    <strong>ALFISHA BOOKSTORE</strong>
                    <small>BOOK MANAGEMENT</small>
                </div>
            </div>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="books.html">Book Collection</a>
                <a href="categories.html">Categories</a>
                <a href="inventory.html" class="active">Inventory</a>
                <a href="about.html">About</a>
                <a href="add-book.html">Add New Book</a>
            </nav>

        </div>
    </header>


    <!-- Main Content -->
    <main class="update-page">

        <section class="page-heading">
            <p class="section-label">BOOK INVENTORY</p>

            <h1>Update Book Details</h1>

            <p>
                Edit the information of an existing book and save
                the changes to your bookstore database.
            </p>
        </section>


        <!-- Update Form -->
        <section class="update-form-section">

            <form action="/books/update" method="POST" id="updateBookForm">

                <input type="hidden" name="book_id" id="book_id">

                <div class="form-group">
                    <label for="title">Book Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter book title"
                        required>
                </div>


                <div class="form-group">
                    <label for="author">Author</label>

                    <input
                        type="text"
                        id="author"
                        name="author"
                        placeholder="Enter author name"
                        required>
                </div>


                <div class="form-group">
                    <label for="category">Category</label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        placeholder="Enter book category"
                        required>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="price">Price (₹)</label>

                        <input
                            type="number"
                            id="price"
                            name="price"
                            placeholder="Enter price"
                            min="0"
                            step="0.01"
                            required>
                    </div>


                    <div class="form-group">
                        <label for="stock">Stock Quantity</label>

                        <input
                            type="number"
                            id="stock"
                            name="stock"
                            placeholder="Enter quantity"
                            min="0"
                            step="1"
                            required>
                    </div>

                </div>


                <div class="form-actions">

                    <button type="submit" class="primary-button">
                        Save Changes
                    </button>

                    <a href="inventory.html" class="secondary-button">
                        Cancel
                    </a>

                </div>

                <p id="formMessage" class="form-message"></p>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <span class="footer-brand">ALFISHA BOOKSTORE</span>

            <p>
                &copy; 2026 ALFISHA BOOKSTORE. All rights reserved.
            </p>
        </div>
    </footer>


    <!-- Load existing book details -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get("id");

        const form = document.getElementById("updateBookForm");
        const message = document.getElementById("formMessage");

        if (!bookId) {
            form.style.display = "none";
            message.textContent =
                "No book selected. Please select a book from Inventory.";
            message.classList.add("error");
        } else {
            loadBookDetails();
        }

        async function loadBookDetails() {
            try {
                const response = await fetch(
                    "/api/books/" + encodeURIComponent(bookId)
                );

                if (!response.ok) {
                    throw new Error("Could not find this book.");
                }

                const book = await response.json();

                document.getElementById("book_id").value = book.book_id;
                document.getElementById("title").value = book.title || "";
                document.getElementById("author").value = book.author || "";
                document.getElementById("category").value = book.category || "";
                document.getElementById("price").value = book.price ?? "";
                document.getElementById("stock").value = book.stock ?? "";

            } catch (error) {
                form.style.display = "none";
                message.textContent =
                    error.message + " Please return to Inventory.";
                message.classList.add("error");
            }
        }
    </script>

</body>
</html>
